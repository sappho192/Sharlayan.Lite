name: CI

on:
  workflow_dispatch:
  push:
    branches: ["min-chat"]
  pull_request:
    branches: ["min-chat"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            7.0.x
            6.0.x

      - name: Generate chat resources
        run: dotnet run --project tools/Sharlayan.ChatResources.Generator/Sharlayan.ChatResources.Generator.csproj --configuration Release --no-launch-profile

      - name: Verify generated resources
        run: git diff --exit-code -- Sharlayan/Resources/GeneratedChatResources.g.cs

      - name: Restore
        run: dotnet restore Sharlayan.sln

      - name: Build all target frameworks
        run: dotnet build Sharlayan.sln --configuration Release --no-restore --nologo -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test Sharlayan.Tests/Sharlayan.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Pack
        run: dotnet pack Sharlayan/Sharlayan.csproj --configuration Release --no-build --no-restore --nologo --output artifacts/packages

      - name: Verify package
        shell: pwsh
        run: ./tools/Verify-Package.ps1 -PackageDirectory artifacts/packages -ExpectedPackageVersion 9.2.1 -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Verify clean package consumer
        shell: pwsh
        run: ./tools/Verify-PackageConsumer.ps1 -PackageDirectory artifacts/packages -ExpectedPackageVersion 9.2.1 -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharlayan-lite-package
          path: artifacts/packages/*
          if-no-files-found: error
