name: Release Sharlayan.Lite

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version, for example 8.1.0-beta.1
        required: true
        type: string
      publish:
        description: Publish the verified package to NuGet
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/min-chat'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            7.0.x
            6.0.x

      - name: Validate package version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $identifier = '(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($env:PACKAGE_VERSION -notmatch "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$") {
            throw "Invalid package version '$env:PACKAGE_VERSION'."
          }

      - name: Generate chat resources
        run: dotnet run --project tools/Sharlayan.ChatResources.Generator/Sharlayan.ChatResources.Generator.csproj --configuration Release --no-launch-profile

      - name: Verify generated resources
        run: git diff --exit-code -- Sharlayan/Resources/GeneratedChatResources.g.cs

      - name: Restore
        run: dotnet restore Sharlayan.sln

      - name: Build all target frameworks
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: dotnet build Sharlayan.sln --configuration Release --no-restore --nologo -p:Version=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test Sharlayan.Tests/Sharlayan.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: dotnet pack Sharlayan/Sharlayan.csproj --configuration Release --no-build --no-restore --nologo --output artifacts/packages -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Verify package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: ./tools/Verify-Package.ps1 -PackageDirectory artifacts/packages -ExpectedPackageVersion $env:PACKAGE_VERSION

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sharlayan-lite-${{ inputs.package_version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/min-chat' }}
    needs: build
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sharlayan-lite-${{ inputs.package_version }}
          path: artifacts/packages

      - name: Validate package artifact
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/packages -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package to publish, found $($packages.Count)."
          }

      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/packages -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package to publish, found $($packages.Count)."
          }

          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet push failed with exit code $LASTEXITCODE."
          }
